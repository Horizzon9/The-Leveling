# -Dfile.encoding/-Dsun.jnu.encoding=UTF-8: proje yolu Turkce karakter iceriyor ("Masaustu");
# Windows'ta Gradle'in kendi UTF-8'i ile varsayilan Cp1254 arasindaki uyumsuzluk forklanan
# worker JVM'lerinin sinif dosyalarini bulamamasina yol acabiliyor.
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
org.gradle.daemon=false

minecraft_version=26.3

# Kimlik, NeoForge surumuyle AYNI kalir: kaydedilmis esya verisi ve ag protokolu ortak.
mod_id=weaponleveling
mod_name=The Leveling
mod_archive_name=the-leveling
mod_version=1.2.0
mod_group_id=dev.weaponleveling
mod_license=MIT
mod_author=ufuko

loom_version=1.19.3
fabric_loader_version=0.20.1
fabric_api_version=0.165.0+26.3

# NeoForge'un ModConfigSpec'i NightConfig uzerine kuruludur; Fabric tarafinda ayni TOML
# bicimini ve yorumlarini uretebilmek icin ayni kutuphane jar-in-jar olarak paketlenir.
night_config_version=3.8.3

# Opsiyonel entegrasyon - zorunlu bagimlilik degildir.
jade_version=26.3.5+fabric

# Opsiyonel entegrasyon - zorunlu bagimlilik degildir.
modmenu_version=21.0.0
