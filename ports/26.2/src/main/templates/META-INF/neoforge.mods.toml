modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mixins]]
config="weaponleveling.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Server-authoritative per-item leveling for weapons and armor. Earn XP through combat, build lasting Relic and Legacy equipment, recover Broken gear, and transfer hard-earned progress between compatible items.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jade"
type="optional"
reason="Shows level and XP for dropped levelable equipment."
versionRange="[21.0.0,)"
ordering="AFTER"
side="CLIENT"
